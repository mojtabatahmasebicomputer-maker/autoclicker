name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyautogui keyboard pyinstaller
      - name: Build exe
        run: pyinstaller --onefile autoclicker.py
      - uses: actions/upload-artifact@v4
        with:
          name: autoclicker-exe
          path: dist/autoclicker.exe
